apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  selector:
    matchLabels:
      app: worker
  # DEMUCS is memory-hungry; start with one worker and scale up on GKE.
  replicas: 1
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - name: worker
        # Change to your Docker Hub user (see worker/Makefile) and bump the tag on each push
        image: YOUR_DOCKER_USERNAME_HERE/demucs-worker:v1
        imagePullPolicy: Always
        resources:
          requests:
            cpu: 500m
            # Raise this (e.g. 6Gi) on GKE; if the pod is OOMKilled, give Docker/the node more RAM.
            memory: 2Gi
        env:
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        - name: MINIO_HOST
          value: "minio:9000"
        - name: MINIO_USER
          value: "rootuser"
        - name: MINIO_PASSWD
          value: "rootpass123"
        volumeMounts:
        - name: scratch
          mountPath: /tmp
      volumes:
      - name: scratch
        emptyDir: {}
